<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>《被窝里的晚安信》可编辑文字层</title>
  <style>
    :root { --ink: #514542; --paper: #edf0f2; --accent: #314a63; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    h1 { margin: 0 0 8px; color: var(--accent); }
    .hint { margin: 0 0 28px; color: #59636d; }
    .book { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 26px; }
    .page { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: #dce2e5; box-shadow: 0 8px 22px #314a6324; }
    .page img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .text { position: absolute; left: 7.3%; top: 6.5%; width: 52%; color: var(--ink); font-size: clamp(15px, 2vw, 27px); line-height: 1.45; font-weight: 600; text-shadow: 0 1px 0 #f1f0ea, 1px 0 0 #f1f0ea, -1px 0 0 #f1f0ea; outline: none; }
    .right { left: auto; right: 7.3%; width: 38%; }
    .page-label { position: absolute; right: 5%; bottom: 3%; padding: 3px 7px; color: #314a63b0; font-size: 12px; background: #ffffff99; border-radius: 4px; }
    .cover-title { position: absolute; left: 7.3%; top: 6.5%; width: 58%; color: var(--accent); font-size: clamp(28px, 4vw, 56px); line-height: 1.14; font-weight: 700; text-shadow: 0 2px 0 #f1f0ea; outline: none; white-space: pre-line; }
    .credit { position: absolute; left: 7.3%; bottom: 5%; color: var(--ink); font-size: clamp(12px, 1.6vw, 21px); outline: none; }
  </style>
</head>
<body>
  <h1>《被窝里的晚安信》可编辑文字层</h1>
  <p class="hint">点击任意文字即可修改；底图始终为无字 clean artwork。最终 PNG 请使用同目录的 <code>render_book.py</code> 根据 <code>text-layout.json</code> 重新渲染。</p>
  <main class="book">
    <section class="page"><img src="../artwork/clean/cover-clean.png" alt="封面无字底图"><div class="cover-title" contenteditable="true">被窝里的
晚安信</div><div class="credit" contenteditable="true">图/文：小葫芦</div><span class="page-label">封面</span></section>
    <section class="page"><img src="../artwork/clean/page-01-clean.png" alt="第1页无字底图"><div class="text" contenteditable="true">夜里，团团洗好脸，抱着小兔。</div><span class="page-label">01</span></section>
    <section class="page"><img src="../artwork/clean/page-02-clean.png" alt="第2页无字底图"><div class="text right" contenteditable="true">小床边，有蜡笔和小纸。</div><span class="page-label">02</span></section>
    <section class="page"><img src="../artwork/clean/page-03-clean.png" alt="第3页无字底图"><div class="text right" contenteditable="true">躺下时，团团把小兔抱紧了。</div><span class="page-label">03</span></section>
    <section class="page"><img src="../artwork/clean/page-04-clean.png" alt="第4页无字底图"><div class="text" contenteditable="true">“我还想和妈妈说晚安。”</div><span class="page-label">04</span></section>
    <section class="page"><img src="../artwork/clean/page-05-clean.png" alt="第5页无字底图"><div class="text" contenteditable="true">妈妈问：“画信，还是坐一会儿？”</div><span class="page-label">05</span></section>
    <section class="page"><img src="../artwork/clean/page-06-clean.png" alt="第6页无字底图"><div class="text" contenteditable="true">团团说：“我想画晚安信。”</div><span class="page-label">06</span></section>
    <section class="page"><img src="../artwork/clean/page-07-clean.png" alt="第7页无字底图"><div class="text" contenteditable="true">小手、小床，画进信里。</div><span class="page-label">07</span></section>
    <section class="page"><img src="../artwork/clean/page-08-clean.png" alt="第8页无字底图"><div class="text" contenteditable="true">“请放在你的书边。”团团说。</div><span class="page-label">08</span></section>
    <section class="page"><img src="../artwork/clean/page-09-clean.png" alt="第9页无字底图"><div class="text right" contenteditable="true">妈妈把信放到书边。</div><span class="page-label">09</span></section>
    <section class="page"><img src="../artwork/clean/page-10-clean.png" alt="第10页无字底图"><div class="text" contenteditable="true">团团拉好小被子：“我先躺一会儿。”</div><span class="page-label">10</span></section>
  </main>
</body>
</html>
